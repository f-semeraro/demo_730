<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Page de connexion</title>
  <link rel="stylesheet" href="style_login.css">
</head>
<body>
  <div class="login-container">
    <img src="img/sncf_logo_login.png" alt="SNCF Logo" class="logo">

    <form class="login-form" id="loginForm">
	  <input type="username" name="username" placeholder="Identifiant utilisateur" required autofocus>
	  <input type="password" name="password" placeholder="Mot de passe" required autofocus>
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script src="app/jquery-3.2.1.min.js"></script>
  <script src="app/script_login.js"></script>
</body>
</html>
